[package]
name = "artcraft-thumbs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Windows Explorer thumbnails for ArtCraft documents (.pcraft, .vectorcraft), badged with the app's icon."
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: the repo has no root workspace on purpose (see CLAUDE.md).
[workspace]

[lib]
# cdylib: the shell extension Explorer loads; rlib: so tests and the example can use it.
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
