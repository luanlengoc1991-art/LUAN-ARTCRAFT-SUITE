# Test only the apps a push / PR actually changed. Each app is its own Cargo workspace.
# Upstream workflows under apps/<id>/.github/ do not run here (GitHub only reads the root .github/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app ids to test, or "all"'
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        shell: bash
        run: |
          all=$(jq -c '[.apps[].id]' config/apps.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.apps }}" = "all" ]; then apps="$all"
            else apps=$(echo '${{ inputs.apps }}' | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";""))'); fi
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"
            else base="${{ github.event.before }}"; fi
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
            apps=$(git diff --name-only "$base" HEAD | sed -n 's#^apps/\([^/]*\)/.*#\1#p' | sort -u \
              | jq -R -s -c --argjson all "$all" 'split("\n") | map(select(length > 0 and (. as $a | $all | index($a))))')
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Affected apps: $apps"

  test:
    needs: detect
    if: needs.detect.outputs.apps != '[]' && needs.detect.outputs.apps != ''
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Enable long paths
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}
          key: ${{ matrix.app }}
      - name: cargo check
        run: cargo check --locked --workspace --all-targets
      - name: cargo test
        run: cargo test --locked
